<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RG Jailbreaks</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#111; color:#eee; margin:0; padding:40px 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.8em; margin-bottom: 4px; }
  .sub { color: #999; margin-top: 0; }
  h3.section-title { margin: 28px 0 10px 0; font-size: 0.95em; color: #999; }
  .card-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .card-row a { display: flex; align-items: center; gap: 8px; background:#222; color:#eee; text-decoration:none; padding: 10px 16px; border-radius: 10px; font-size: 0.9em; }
  .card-row img { width: 24px; height: 24px; }
  .url-box { background:#1a1a1a; padding: 10px 14px; border-radius: 8px; font-size: 0.85em; word-break: break-all; color:#aaa; margin-top: 20px; }
  .tweak-list { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; }
  .tweak-card { display: flex; gap: 14px; align-items: center; background:#1a1a1a; padding: 12px; border-radius: 10px; text-decoration:none; color:#eee; }
  .tweak-card img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background:#333; }
  .tweak-info h3 { margin: 0 0 2px 0; font-size: 1em; }
  .tweak-info p { margin: 0; font-size: 0.85em; color: #999; }
  .empty { color: #666; font-size: 0.9em; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RG Jailbreaks</h1>
  <p class="sub">Cydia/Sileo repo for rg</p>

  <h3 class="section-title">Add to your package manager</h3>
  <div class="card-row">
    <a href="cydia://url/https://ivanisgoodatcoding52.github.io/rgjailbreaks/">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cydia_logo.png" alt="Cydia">
      Add to Cydia
    </a>
    <a href="sileo://source/https://ivanisgoodatcoding52.github.io/rgjailbreaks/">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Icon_Sileo.png" alt="Sileo">
      Add to Sileo
    </a>
  </div>

  <div class="url-box">https://ivanisgoodatcoding52.github.io/rgjailbreaks/</div>

  <h3 class="section-title">Links</h3>
  <div class="card-row">
    <a href="https://discord.gg/ga7yxwvrXc" target="_blank">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Discord logo.svg" alt="Discord">
      Nonprofit Discord
    </a>
    <a href="https://discord.gg/CHgBRkab2e" target="_blank">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Discord logo.svg" alt="Discord">
      Personal Discord
    </a>
    <a href="https://www.youtube.com/@rgcodesarray" target="_blank">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Logo Youtube.svg" alt="YouTube">
      Coding Channel
    </a>
    <a href="https://www.youtube.com/@ivanisgood52" target="_blank">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Logo Youtube.svg" alt="YouTube">
      Main Channel
    </a>
  </div>

  <div id="tweak-list" class="tweak-list"></div>
  <p id="empty-msg" class="empty" style="display:none;">No tweaks published yet.</p>
</div>

<script>
fetch('tweaks.json')
  .then(r => r.json())
  .then(tweaks => {
    const list = document.getElementById('tweak-list');
    if (!tweaks.length) {
      document.getElementById('empty-msg').style.display = 'block';
      return;
    }
    tweaks.forEach(t => {
      const a = document.createElement('a');
      a.className = 'tweak-card';
      a.href = 'depiction.html?id=' + encodeURIComponent(t.id);
      a.innerHTML = `
        <img src="${t.icon}" alt="${t.name}">
        <div class="tweak-info">
          <h3>${t.name}</h3>
          <p>${t.tagline}</p>
        </div>`;
      list.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById('empty-msg').style.display = 'block';
  });
</script>
</body>
</html>
